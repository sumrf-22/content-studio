<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Content Studio — {{ page_title }}</title>
    <link rel="stylesheet" href="/static/style.css">
</head>
<body>
    <div class="app">
        {% include "_sidebar.html" %}

        <main class="main">
            <header class="main-header">
                <div class="header-left">
                    <h1 class="page-title">{{ page_title }}</h1>
                    <p class="page-subtitle">{{ page_subtitle }}</p>
                </div>
            </header>

            <div class="grid" style="flex:1; overflow-y:auto; padding:16px 24px;">
                <section class="card page-placeholder">
                    <span class="page-kicker">Coming soon</span>
                    <h2>{{ page_title }}</h2>
                    <p>{{ page_body }}</p>
                    <a class="btn-primary page-back" href="/">Back to Dashboard</a>
                </section>
            </div>
        </main>
    </div>
</body>
</html>
